---
name: Release

# Manual only. Publishes the fork's images to ghcr.io/the-wondersmith/chaptarr.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
    - name: Require a releasable branch
      shell: bash
      run: |
        set -euo pipefail
        if [[ "${GITHUB_REF}" != "refs/heads/fork/main" ]]; then
          echo "Releases must run from fork/main; selected ref is ${GITHUB_REF}."
          exit 1
        fi

  validate:
    needs: preflight
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read

  release:
    needs: validate
    runs-on: ubuntu-latest
    # Named only so the guard below can see the environment secret. This job does
    # not compile anything itself.
    environment: default
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.head.outputs.sha }}

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        fetch-depth: 0

    # The docker job compiles Release and so needs the SixLabors key, but it runs
    # after the tag and the GitHub release already exist. Checking resolution here
    # turns "tag pushed, no image published" into a clean pre-tag failure.
    - name: Guard - SixLabors license key resolves
      env:
        SIX_LABORS_LICENSE_KEY: ${{ secrets.SIX_LABORS_LICENSE_KEY }}
      shell: bash
      run: |
        set -euo pipefail
        if [[ -z "${SIX_LABORS_LICENSE_KEY:-}" ]]; then
          echo "SIX_LABORS_LICENSE_KEY did not resolve from the 'default' environment."
          echo "The Docker image build would fail after the release was already created."
          exit 1
        fi
        echo "SixLabors license key resolved."

    - name: Resolve head
      id: head
      run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

    - name: Guard - versions in sync
      run: python3 build-tools/version_guard.py sync

    - name: Resolve tag
      id: tag
      shell: bash
      run: |
        set -euo pipefail
        VERSION="$(python3 -c "import json; print(json.load(open('package.json', encoding='utf-8'))['version'])")"
        echo "tag=v${VERSION}" >> "$GITHUB_OUTPUT"

    - name: Guard - tag matches versions
      run: python3 build-tools/version_guard.py release-tag --tag "${{ steps.tag.outputs.tag }}"

    - name: Guard - selected branch has not advanced
      shell: bash
      run: |
        set -euo pipefail
        HEAD_SHA="$(git rev-parse HEAD)"
        REMOTE_HEAD_SHA="$(git ls-remote origin "refs/heads/${GITHUB_REF_NAME}" | awk '{print $1}')"

        if [[ -z "$REMOTE_HEAD_SHA" ]]; then
          echo "Unable to resolve the current remote head for ${GITHUB_REF_NAME}."
          exit 1
        fi

        if [[ "$REMOTE_HEAD_SHA" != "$HEAD_SHA" ]]; then
          echo "${GITHUB_REF_NAME} advanced to ${REMOTE_HEAD_SHA} while this run tested ${HEAD_SHA}."
          echo "Run the release workflow again so the published image includes the current branch head."
          exit 1
        fi

    - name: Create tag if absent
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        TAG="${{ steps.tag.outputs.tag }}"
        HEAD_SHA="$(git rev-parse HEAD)"

        REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}^{}" | awk '{print $1}' || true)"
        if [[ -z "$REMOTE_SHA" ]]; then
          REMOTE_SHA="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk '{print $1}' || true)"
        fi

        if [[ -n "$REMOTE_SHA" && "$REMOTE_SHA" != "$HEAD_SHA" ]]; then
          echo "Tag $TAG already exists at $REMOTE_SHA but HEAD is $HEAD_SHA. Bump the version first."
          exit 1
        fi

        if [[ -z "$REMOTE_SHA" ]]; then
          echo "Creating tag $TAG"
          git tag "$TAG"
          git push origin "$TAG"
        else
          echo "Tag $TAG already on this commit."
        fi

    - name: Create or promote the release
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      shell: bash
      run: |
        set -euo pipefail
        TAG="${{ steps.tag.outputs.tag }}"

        if gh release view "$TAG" >/dev/null 2>&1; then
          echo "Release $TAG already exists."
          exit 0
        fi

        # Native zips stay suppressed until they pass the viability gates. Docker is
        # the supported install.
        gh release create "$TAG" \
          --title "Chaptarr $TAG" \
          --generate-notes \
          --verify-tag \
          --latest

  # Images publish here and nowhere else, so merging PRs never ships an update.
  docker:
    needs: release
    uses: ./.github/workflows/docker-publish.yml
    permissions:
      contents: read
      packages: write
    with:
      sha: ${{ needs.release.outputs.sha }}
      branch: ${{ github.ref_name }}
